name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check repository identity
        run: bash scripts/validate-repo-identity.sh

  lint:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  security-scan:
    needs: repo-identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    needs: repo-identity
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ['12111:12111']
    env:
      STRIPE_MOCK_URL: http://127.0.0.1:12111
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Wait for Stripe mock
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:12111/ || true)
            if [ "$status" = 401 ]; then exit 0; fi
            sleep 1
          done
          echo "stripe-mock did not become ready" >&2
          exit 1
      - run: npm test

  build:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  pack-artifacts:
    needs: repo-identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:pack
        env:
          NENNBOX_PACK_DIR: /tmp/nennbox-product-artifacts

  boundaries:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries

  docs:
    needs: repo-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tenant inventory and isolation matrix
        run: python3 scripts/validate_tenant_inventory.py
      - name: Validate product resource inventory
        run: python3 scripts/validate_product_inventory.py
      - name: Check relative Markdown links
        run: python3 scripts/check_relative_markdown_links.py

  integration:
    needs: repo-identity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nennbox
          POSTGRES_PASSWORD: nennbox
          POSTGRES_DB: nennbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nennbox -d nennbox_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: true
      NENNBOX_TEST_DATABASE_URL: postgres://nennbox:nennbox@127.0.0.1:5432/nennbox_test
      DATABASE_URL: postgres://nennbox:nennbox@127.0.0.1:5432/nennbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test -- --run --no-file-parallelism $(find packages scripts -type f \( -name '*.integration.test.ts' -o -name 'integration.test.ts' \) -print)

  core-community:
    name: core (community)
    needs: repo-identity
    runs-on: ubuntu-latest
    env:
      NENNBOX_TEST_MODE: community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- packages/core packages/api packages/worker

  core-cloud:
    name: core (cloud)
    needs: repo-identity
    runs-on: ubuntu-latest
    env:
      NENNBOX_TEST_MODE: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -- packages/core packages/api packages/worker

  community-smoke:
    needs: repo-identity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Prove isolated Community backup and full restore
        run: bash scripts/community-restore-smoke.sh
      - name: Upload browser test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-restore-playwright-results
          path: packages/app/test-results/
          if-no-files-found: ignore
