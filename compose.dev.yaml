services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nennbox
      POSTGRES_PASSWORD: nennbox
      POSTGRES_DB: nennbox_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - nennbox-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nennbox -d nennbox_dev']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: nennbox
      MINIO_ROOT_PASSWORD: nennbox-local
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - nennbox-minio:/data
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  nennbox-minio:
  nennbox-postgres:
